<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
      /* -------- BASE STYLES -------- */
      :root {
        --primary: #0077ff;
        --accent: #ff6600;
        --text-dark: #222;
        --text-light: #555;
        --bg-light: #f2f2f2;
        --bg-white: #fff;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-light);
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      article {
        background: var(--bg-white);
        width: 100%;
        max-width: 350px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: all 0.3s ease-in-out;
      }

      article:hover {
        transform: scale(1.02);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      figure {
        margin: 0;
        overflow: hidden;
        border-bottom: 2px solid #eee;
      }

      figure img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      figure img:hover {
        transform: scale(1.05);
      }

      header {
        text-align: center;
        padding: 15px;
      }

      header h2 {
        margin: 10px 0 5px;
        font-size: 1.5rem;
        color: var(--text-dark);
      }

      header p {
        color: var(--text-light);
        font-size: 0.95rem;
      }

      nav {
        text-align: center;
        margin: 10px 0;
      }

      nav a {
        text-decoration: none;
        color: var(--primary);
        margin: 0 10px;
        font-weight: 500;
        transition: color 0.3s;
      }

      nav a:hover {
        color: var(--accent);
      }

      section {
        padding: 10px 20px;
      }

      section h3 {
        font-size: 1rem;
        color: var(--text-dark);
        margin-bottom: 5px;
      }

      section ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
      }

      section ul li {
        padding: 3px 0;
        color: var(--text-light);
        font-size: 0.9rem;
      }

      footer {
        text-align: center;
        font-size: 0.8rem;
        padding: 10px 0;
        background: #fafafa;
        color: #777;
        border-top: 1px solid #eee;
      }

      /* -------- RESPONSIVE DESIGN -------- */

      @media (max-width: 768px) {
        article {
          max-width: 90%;
        }

        figure img {
          height: 200px;
        }

        header h2 {
          font-size: 1.3rem;
        }

        header p {
          font-size: 0.9rem;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        article {
          border-radius: 12px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        figure img {
          height: 180px;
        }

        nav a {
          margin: 0 5px;
          font-size: 0.85rem;
        }

        section h3 {
          font-size: 0.95rem;
        }

        section ul li {
          font-size: 0.85rem;
        }

        footer {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>

  <body>
    <article data-testid="test-profile-card">
      <figure>
        <img
          src="whatspp.png.jpg"
          alt="User Avatar"
          data-testid="test-user-avatar"
        />
      </figure>

      <header>
        <h2 data-testid="test-user-name">Samuel Sossa</h2>
        <p data-testid="test-user-bio">Frontend Developer • Anime Enthusiast</p>
      </header>

      <nav data-testid="test-user-social-links">
        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"
          >Twitter</a
        >
        <a href="https://github.com" target="_blank" rel="noopener noreferrer"
          >GitHub</a
        >
      </nav>

      <section data-testid="test-user-hobbies">
        <h3>Hobbies</h3>
        <ul>
          <li>Coding cool projects</li>
          <li>Listening to Afro-R&B</li>
          <li>Watching sci-fi and anime</li>
        </ul>
      </section>

      <section data-testid="test-user-dislikes">
        <h3>Dislikes</h3>
        <ul>
          <li>Lack of electricity</li>
          <li>Overheating laptops</li>
          <li>football</li>
        </ul>
      </section>

      <footer data-testid="test-user-time">
        <span id="current-time">Loading time...</span>
      </footer>
    </article>

    <script>
      // -------- SCRIPT.JS CONTENT --------
      const timeElement = document.getElementById("current-time");

      function updateTime() {
        const now = new Date();
        timeElement.textContent = now.toLocaleString();
      }

      updateTime();
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
